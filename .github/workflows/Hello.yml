

name: Primeiro CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  Validacao:
  #Maquina Virtual
    runs-on: ubuntu-latest


    # Tarefas para a tarefa Validação
    steps:
      - name: Fazendo o gitclone
        uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Listando o diretorio para ver os arquivos
        run: ls -l
      - name: Deixando uma mensagem 
        run: echo "Esta funcionando o CI"
